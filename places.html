function formatUSD(n) {
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(0) + 'M';
  return '$' + n.toLocaleString();
}

function getFiltered() {
  return PLACES_DATA.places.filter(p => {
    if (activeFilters.level && p.srt_level !== activeFilters.level) return false;
    if (activeFilters.capacity && p.capacity.category !== activeFilters.capacity) return false;
    if (activeFilters.window && p.window.category !== activeFilters.window) return false;
    return true;
  });
}

function renderFilters() {
  const sec = document.getElementById('filters-section');
  sec.innerHTML = `
    <div class="filter-group">
      <span class="filter-label">Уровень СРТ</span>
      ${[1,2,3,4,5,6,7,8,9].map(l => `
        <button class="filter-btn" data-filter="level" data-value="${l}"
                style="border-color: ${LEVEL_COLORS[l]}33">${l}</button>
      `).join('')}
    </div>
    <div class="filter-group">
      <span class="filter-label">Ёмкость</span>
      <button class="filter-btn" data-filter="capacity" data-value="large">Крупная</button>
      <button class="filter-btn" data-filter="capacity" data-value="medium">Средняя</button>
      <button class="filter-btn" data-filter="capacity" data-value="small">Малая</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">Окно</span>
      <button class="filter-btn" data-filter="window" data-value="open">Открыто</button>
      <button class="filter-btn" data-filter="window" data-value="narrowing">Сужается</button>
      <button class="filter-btn" data-filter="window" data-value="closing">Закрывается</button>
    </div>
    <button class="filter-reset" id="filter-reset">Сбросить</button>
  `;

  sec.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.filter;
      const val = btn.dataset.value;
      const parsed = key === 'level' ? parseInt(val) : val;

      if (activeFilters[key] === parsed) {
        activeFilters[key] = null;
        btn.classList.remove('active');
      } else {
        sec.querySelectorAll(`[data-filter="${key}"]`).forEach(b => b.classList.remove('active'));
        activeFilters[key] = parsed;
        btn.classList.add('active');
      }
      applyFilters();
    });
  });

  document.getElementById('filter-reset').addEventListener('click', () => {
    activeFilters = { level: null, capacity: null, window: null };
    sec.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    applyFilters();
  });
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'bubble') {
        setTimeout(() => Plotly.Plots.resize('bubble-chart'), 50);
      }
    });
  });
}

      card.style.borderLeftWidth = '3px';
      card.onclick = () => openModal(p.id);
      card.style.cursor = 'pointer';

      card.innerHTML = `
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.description}</div>
        <div class="card-badges">
          <span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]} ${p.capacity.range_label}</span>
          <span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span>
          <span class="badge badge-conf-${p.confidence}">⚡ ${CONF_RU[p.confidence]}</span>
        </div>
        <div class="card-players">Игроки: <span>${p.key_players.slice(0, 3).join(', ')}${p.key_players.length > 3 ? '...' : ''}</span></div>
        <div class="card-conditions">${p.entry_conditions.map(c => '→ ' + c).join('<br>')}</div>
        <div class="card-evidence">${p.evidence}</div>
      `;
      col.appendChild(card);
    });

    grid.appendChild(col);
  }
}

// ═══════════════════════════════════════════════════════
// TABLE
// ═══════════════════════════════════════════════════════
function renderTable() {
  const places = getFiltered();
  const sorted = sortPlaces(places);

  // Head
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<tr>
    ${tableCol('srt_level', 'Ур.')}
    ${tableCol('name', 'Название')}
    ${tableCol('description', 'Описание')}
    ${tableCol('capacity', 'Ёмкость')}
    ${tableCol('window', 'Окно')}
    ${tableCol('confidence', 'Уверенность')}
    ${tableCol('key_players', 'Ключевые игроки')}
    ${tableCol('entry_conditions', 'Условия входа')}
    ${tableCol('evidence', 'Evidence')}
  </tr>`;

  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'asc';
      }
      renderTable();
    });
  });

  // Body
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = sorted.map(p => `
    <tr onclick="openModal('${p.id}')" style="cursor:pointer">
      <td class="col-level level-${p.srt_level}"><span class="level-dot"></span>${p.srt_level}</td>
      <td class="col-name">${p.name}</td>
      <td class="col-desc">${p.description}</td>
      <td><span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]}</span><br><small style="color:#6b7280">${p.capacity.range_label}</small></td>
      <td><span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span></td>
      <td><span class="badge badge-conf-${p.confidence}">${CONF_RU[p.confidence]}</span></td>
      <td class="col-players">${p.key_players.join(', ')}</td>
      <td class="col-conditions">${p.entry_conditions.join('; ')}</td>
      <td class="col-evidence">${p.evidence}</td>
    </tr>
  `).join('');
}

function tableCol(col, label) {
  const arrow = sortCol === col ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th data-col="${col}">${label}<span class="sort-arrow">${arrow}</span></th>`;
}

function sortPlaces(places) {
  if (!sortCol) return places;
  return [...places].sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'srt_level': va = a.srt_level; vb = b.srt_level; break;
      case 'name': va = a.name; vb = b.name; break;
      case 'description': va = a.description; vb = b.description; break;
      case 'capacity':
        const cm = { large: 3, medium: 2, small: 1 };
        va = cm[a.capacity.category]; vb = cm[b.capacity.category]; break;
      case 'window':
        const wm = { open: 1, narrowing: 2, closing: 3 };
        va = wm[a.window.category]; vb = wm[b.window.category]; break;
      case 'confidence':
        const cfm = { high: 3, medium: 2, low: 1 };
        va = cfm[a.confidence]; vb = cfm[b.confidence]; break;
      default: va = a[sortCol]; vb = b[sortCol];
    }
    if (typeof va === 'string') {
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

// ═══════════════════════════════════════════════════════
// DETAIL MODAL
// ═══════════════════════════════════════════════════════
function initModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

function openModal(id) {
  const p = PLACES_DATA.places.find(pl => pl.id === id);
  if (!p) return;

  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-level level-${p.srt_level}">
      <span class="level-dot"></span>
      Уровень ${p.srt_level}: ${SRT_LEVELS[p.srt_level]}
    </div>
    <div class="modal-title">${p.name}</div>
    <div class="modal-desc">${p.description}</div>

    <div class="card-badges" style="margin-bottom:16px">
      <span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]} ${p.capacity.range_label}</span>
      <span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span>
      <span class="badge badge-conf-${p.confidence}">⚡ ${CONF_RU[p.confidence]}</span>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Экономическая ёмкость</div>
      <div class="modal-section-body">
        <p><strong>Категория:</strong> ${CAPACITY_RU[p.capacity.category]} (${p.capacity.range_label})</p>
        <p><strong>Подтверждённый объём:</strong> ${formatUSD(p.capacity.evidence_usd)}</p>
        <p><strong>Активных игроков:</strong> ${p.capacity.active_players_count}</p>
        <p><strong>Обоснование:</strong> ${p.capacity.reasoning}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Окно возможностей</div>
      <div class="modal-section-body">
        <p><strong>Статус:</strong> ${WINDOW_RU[p.window.category]} — ${p.window.label}</p>
        <p>${p.window.description}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Условия входа</div>
      <div class="modal-section-body">
        <ul>${p.entry_conditions.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Ключевые игроки</div>
      <div class="modal-section-body">${p.key_players.join(', ')}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Evidence</div>
      <div class="modal-section-body" style="font-style:italic">${p.evidence}</div>
    </div>

    ${p.audience_lens ? `
    <div class="modal-section">
      <div class="modal-section-title">Целевая аудитория</div>
      <div class="modal-section-body">
        ${p.audience_lens.map(a => {
          const labels = { investor: '🎯 Инвестор', operator: '⚙️ Оператор', founder: '🚀 Стартапер' };
          return `<span class="badge" style="background:rgba(255,255,255,0.06);color:#c8cdd5;margin-right:6px">${labels[a] || a}</span>`;
        }).join('')}
      </div>
    </div>
    ` : ''}
  `;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
</script>
</body>
</html>
