let EKEN_ROUTE_CONFIG = { schemaVersion: '1.0', updatedAt: null, routes: [] };

async function loadEkenRouteConfig() {
  try {
    const response = await fetch('/data/eken-routes.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const config = await response.json();
    if (!Array.isArray(config.routes)) throw new Error('Поле routes отсутствует');
    EKEN_ROUTE_CONFIG = config;
  } catch (error) {
    console.warn('Маршруты Eken недоступны; карта показана без переходов.', error);
  }
}

function getEkenRoute(placeOrId) {
  const id = typeof placeOrId === 'string' ? placeOrId : placeOrId.id;
  return EKEN_ROUTE_CONFIG.routes.find(route => route.enabled && route.placeId === id) || null;
}

function hasEkenRoute(placeOrId) {
  return Boolean(getEkenRoute(placeOrId));
}

function getEkenRouteCount() {
  const currentPlaceIds = new Set(PLACES_DATA.places.map(place => place.id));
  return EKEN_ROUTE_CONFIG.routes.filter(route => route.enabled && currentPlaceIds.has(route.placeId)).length;
}

function getEkenPositionUrl(placeOrId) {
  const id = typeof placeOrId === 'string' ? placeOrId : placeOrId.id;
  const route = getEkenRoute(id);
  if (!route) return null;
  const params = new URLSearchParams({ place: id, route: route.positionRouteId, source: 'places' });
  return `/positions?${params.toString()}`;
}

function formatUSD(n) {
  if (n == null) return "Не установлено";
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(0) + 'M';
  return '$' + n.toLocaleString();
}

  const id = typeof placeOrId === 'string' ? placeOrId : placeOrId.id;
  const publicOrigin = window.location.protocol === 'file:' ? 'https://verkhovskiy.ai' : window.location.origin;
  return new URL(`/share/v1/places/${encodeURIComponent(id)}/`, publicOrigin).toString();
}

function trackPlaceShare(eventName, place, target) {

function updatePlaceQuery(id) {
  const url = new URL(window.location.href);
  if (id) url.searchParams.set('place', id);
  else url.searchParams.delete('place');
  window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
}

function stableJitter(id, axis) {
  const source = `${id}:${axis}`;
  let hash = 0;
  for (let i = 0; i < source.length; i++) {
    hash = ((hash << 5) - hash + source.charCodeAt(i)) | 0;
  }
  return ((Math.abs(hash) % 1000) / 999) - 0.5;
}

function getFiltered(source = PLACES_DATA.places) {
  return source.filter(p => {
    if (activeFilters.level && p.srt_level !== activeFilters.level) return false;
    if (activeFilters.capacity && p.capacity.category !== activeFilters.capacity) return false;
    if (activeFilters.window && p.window.category !== activeFilters.window) return false;
    if (activeFilters.eken && !hasEkenRoute(p)) return false;
    return true;
  });
}

      const val = btn.dataset.value;

      if (activeFilters[key] === parsed) {
        activeFilters[key] = null;
        btn.classList.remove('active');
      } else {
        sec.querySelectorAll(`[data-filter="${key}"]`).forEach(b => b.classList.remove('active'));

        btn.classList.add('active');
      }
      applyFilters();
    });
  });

  });

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'bubble') {
        renderBubble();
      }
    });
  });
}

  // Stable slots from the full dataset keep bubbles still when filters change.
  // Vertical spacing in unknown-only mode is layout, never a market estimate.
  const slots = new Map();
  for (let level = 1; level <= 9; level++) {
    const items = chartPlaces.filter(p => p.srt_level === level && p.capacity.category === 'unknown')
      .sort((a, b) => a.id.localeCompare(b.id));
    items.forEach((p, i) => slots.set(p.id, items.length === 1 ? 0 : (i / (items.length - 1) - 0.5) * 1.4));
  }
  document.getElementById('bubble-note').textContent = !places.length
    ? 'Нет мест с выбранными характеристиками. Сбросьте фильтры.'
    : historical
    ? 'Предыдущая оценка · не перепроверена. Высота — ёмкость, размер — уверенность, обводка — окно входа.'
    : unknownOnly
    ? 'Ёмкость мест пока не установлена. Пузыри разнесены по вертикали для удобства выбора; высота не означает размер рынка. Нажмите на пузырь, чтобы открыть место. На узком экране диаграмму можно прокручивать вправо.'
    : 'Высота показывает категорию ёмкости. Места без оценки находятся в строке «Неизвестна».';
  const pointCoordinates = new Map();
  for (let level = 1; level <= 9; level++) {
    for (const category of Object.keys(capMap)) {
      const items = chartPlaces.filter(p => p.srt_level === level && p.capacity.category === category)
        .sort((a, b) => a.id.localeCompare(b.id));
      const rows = Math.ceil(items.length / 2);
      items.forEach((p, i) => pointCoordinates.set(p.id, {
        x: unknownOnly ? level : level + (items.length === 1 ? 0 : (i % 2 ? 0.22 : -0.22)),
        y: unknownOnly ? slots.get(p.id) : capMap[category] + (Math.floor(i / 2) - (rows - 1) / 2) * 0.28,
      }));
    }
  }

  // Group by window category for legend
  const groups = { unknown: [], open: [], narrowing: [], closing: [] };
  places.forEach(p => {
    const wc = p.window.category;
    if (groups[wc]) groups[wc].push(p);
  });

  const traces = Object.entries(groups).map(([wc, items]) => ({
    x: items.map(p => pointCoordinates.get(p.id).x),
    y: items.map(p => pointCoordinates.get(p.id).y),
    text: items.map(p =>
      `<b>${p.name}</b><br>` +
      `Уровень ${p.srt_level}: ${SRT_LEVELS[p.srt_level]}<br>` +
      (historical ? '<b>Оценки августа · не перепроверены</b><br>' : '') +
      `Ёмкость: ${CAPACITY_RU[p.capacity.category]} (${p.capacity.range_label})<br>` +
      `Окно: ${WINDOW_RU[p.window.category]}<br>` +
      `Уверенность: ${CONF_RU[p.confidence]}<br>` +
      `Игроки: ${p.key_players.slice(0, 3).join(', ')}` +
      (hasEkenRoute(p) ? `<br><b>Выбрать первый шаг</b><br>Позиция → пробная задача → бриф для EKEN` : '')
    ),
    customdata: items.map(p => p.id),
    mode: 'markers',
    marker: {
      size: items.map(p => confSize[p.confidence] + (hasEkenRoute(p) ? 3 : 0)),
      symbol: 'circle',
      color: items.map(p => LEVEL_COLORS[p.srt_level]),
      opacity: items.map(p => dependencyMode ? (focused.has(p.id) ? 1 : related.has(p.id) ? 0.35 : 0.1) : hasEkenRoute(p) ? 0.98 : 0.7),
      line: {
        width: items.map(p => dependencyMode && focused.has(p.id) ? 4 : hasEkenRoute(p) ? 2.5 : 1.5),
        color: items.map(p => dependencyMode && focused.has(p.id) ? '#ffffff' : hasEkenRoute(p) ? '#c4b5fd' : WINDOW_COLORS[wc]),
      },
    },
    name: WINDOW_RU[wc],
    hovertemplate: '%{text}<extra></extra>',
    type: 'scatter',
  }));

  const ekenTraces = places.filter(p => hasEkenRoute(p) && (!dependencyMode || focused.has(p.id))).map(p => {
    const point = pointCoordinates.get(p.id);
    return {
      x: [point.x, point.x + 0.13],
      y: [point.y, point.y + (unknownOnly ? 0.065 : 0.12)],
      text: ['', '<b>E</b>'],
      textposition: 'middle center',
      textfont: { family: 'Inter, sans-serif', size: 9, color: '#f5f3ff' },
      customdata: [p.id, p.id],
      mode: 'lines+markers+text',
      line: { width: 1.2, color: 'rgba(167,139,250,0.72)' },
      marker: {
        size: [0, 17],
        color: ['rgba(0,0,0,0)', '#5b3f93'],
        line: { width: [0, 1], color: ['rgba(0,0,0,0)', '#c4b5fd'] },
      },
      hoverinfo: 'skip',
      showlegend: false,
      cliponaxis: false,
      type: 'scatter',
    };
  });

  const layout = {
    paper_bgcolor: '#0a0e17',
    plot_bgcolor: '#0f1320',
    font: { family: 'Inter, sans-serif', color: '#9ca3af', size: 12 },
    height: 680,
    margin: { t: 60, r: 30, b: 60, l: unknownOnly ? 30 : 70 },
    xaxis: {
      title: { text: 'Уровень СРТ', font: { size: 13, color: '#6b7280' } },
      tickmode: 'array',
      tickvals: [1,2,3,4,5,6,7,8,9],
      ticktext: ['1','2','3','4','5','6','7','8','9'],
      gridcolor: 'rgba(255,255,255,0.04)',
      zeroline: false,
      range: [0.3, 9.7],
    },
    yaxis: {
      title: { text: unknownOnly ? '' : historical ? 'Экономическая ёмкость · предыдущий снимок' : 'Экономическая ёмкость', font: { size: 13, color: '#6b7280' } },
      tickmode: 'array',
      tickvals: unknownOnly ? [] : [0, 1, 2, 3],
      ticktext: ['Неизвестна', '< $100M', '$100M–$1B', '> $1B'],
      gridcolor: 'rgba(255,255,255,0.04)',
      zeroline: false,
      range: unknownOnly ? [-1, 1] : [-0.5, 3.6],
      fixedrange: true,
    },
    legend: {
      x: 0, y: 1.12,
      orientation: 'h',
      font: { size: 11 },
      bgcolor: 'transparent',
    },
    hoverlabel: {
      bgcolor: '#1a1f2e',
      bordercolor: 'rgba(255,255,255,0.1)',
      font: { family: 'Inter', size: 12, color: '#e5e7eb' },
    },
    annotations: [1,2,3,4,5,6,7,8,9].map(l => ({
      x: l, y: 1, xref: 'x', yref: 'paper', yanchor: 'bottom',
      text: SRT_LEVELS[l].split(' ').slice(0, 2).map(word => word.length > 12 ? word.slice(0, 11) + '…' : word).join('<br>'),
      showarrow: false,
      font: { size: 9, color: LEVEL_COLORS[l] },
    })),
  };

  if (dependencyMode) {
    edges.filter(e => visible.has(e.from) && visible.has(e.to)).forEach(e => {
      const a = pointCoordinates.get(e.from), b = pointCoordinates.get(e.to);
      traces.unshift({x:[a.x,b.x],y:[a.y,b.y],mode:'lines',type:'scatter',customdata:[`edge:${DEPENDENCY_EDGES.indexOf(e)}`,`edge:${DEPENDENCY_EDGES.indexOf(e)}`],text:[e.result,e.result],line:{color:e===relation?'#f4ce83':'#8b7aa9',width:e===relation?4:2,dash:'solid'},hovertemplate:'%{text}<extra>Есть источник · нажмите для объяснения</extra>',showlegend:false});
      layout.annotations.push({x:b.x,y:b.y,ax:b.x + (a.x-b.x)*0.18,ay:b.y + (a.y-b.y)*0.18,xref:'x',yref:'y',axref:'x',ayref:'y',text:'',showarrow:true,arrowhead:3,arrowsize:1.3,arrowwidth:1.5,arrowcolor:e===relation?'#f4ce83':'#655b77',standoff:20,startstandoff:20});
    });
  }
  if (dependencyMode && (!allRelations || relation)) {
    [...focused].filter(id => visible.has(id)).forEach((id, i) => {
      const point = pointCoordinates.get(id);
      layout.annotations.push({x:point.x,y:point.y,xref:'x',yref:'y',text:shortName(id).split(' ').join('<br>'),showarrow:false,yshift:i===0?48:-48,bgcolor:'#172335',bordercolor:'#b9a4dc',borderpad:5,font:{size:11,color:'#ffffff'}});
    });
  }
  const config = {
    responsive: true,
    displayModeBar: false,
  };

  const chartTraces = [...traces, ...ekenTraces];
  await Plotly.newPlot('bubble-chart', chartTraces, layout, config);
  {
    const seen = new Set();
    document.querySelectorAll('#bubble-chart .scatterlayer .trace').forEach((group, i) => {
      group.querySelectorAll('.point').forEach((point, j) => {
        const id = chartTraces[i]?.customdata?.[j], place = getPlaceById(id);
        if (!place || seen.has(id)) return;
        seen.add(id);
        point.setAttribute('tabindex', '0');
        point.setAttribute('role', 'button');
        point.setAttribute('aria-label', place.name);
        point.dataset.placeTrigger = id;
        point.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault(); openModal(id, true, point);
          }
        });
      });
    });
  }

  document.getElementById('bubble-chart').removeAllListeners('plotly_click');
  document.getElementById('bubble-chart').on('plotly_click', (data) => {
    if (data.points.length > 0) {
      const id = data.points[0].customdata;
      if (!id) return;
      if (String(id).startsWith('edge:')) { selectDependency(Number(id.slice(5))); return; }
      if (dependencyMode) {
        picker.value = id;
        document.getElementById('dependency-scope').value = 'local';
        selectedDependency = -1;
        renderBubble();
      } else {
        openModal(id, true, document.querySelector(`#bubble-chart [data-place-trigger="${id}"]`) || document.getElementById('bubble-chart'));
      }
    }
  });
  } catch (error) {
    showChartUnavailable();
  } finally {
    chartRendering = false;
    if (chartRenderPending) { chartRenderPending = false; renderBubble(); }
  }
}

function renderTable() {
  const places = getFiltered();
  const sorted = sortPlaces(places);

  // Head
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<tr>
    ${tableCol('srt_level', 'Ур.')}
    ${tableCol('name', 'Название')}

    ${tableCol('window', 'Окно')}
    ${tableCol('confidence', 'Уверенность')}
    ${tableCol('key_players', 'Ключевые игроки')}
    ${tableCol('entry_conditions', 'Условия входа')}
    ${tableCol('evidence', 'Evidence')}
  </tr>`;

  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'asc';
      }
      renderTable();
    });
  });

  // Body
  const tbody = document.getElementById('table-body');
  if (!sorted.length) { tbody.innerHTML = '<tr><td colspan=9>Нет мест с подтверждённой выбранной характеристикой. Сбросьте фильтры.</td></tr>'; return; }
  tbody.innerHTML = sorted.map(p => `
    <tr class="${hasEkenRoute(p) ? 'is-eken-enabled' : ''}" onclick="openModal('${p.id}', true, this.querySelector('.place-detail-trigger'))" style="cursor:pointer">
      <td class="col-level level-${p.srt_level}"><span class="level-dot"></span>${p.srt_level}</td>
      <td class="col-name">
        <div class="table-name-row">
          <button type="button" class="place-detail-trigger">${p.name}</button>
          <span class="table-name-actions">
            <button
              type="button"
              class="place-share-button"
              aria-label="Поделиться местом"
              title="Поделиться"
              onclick="openPlaceShare('${p.id}', event)"
            >↗</button>
            ${hasEkenRoute(p) ? '<span class="eken-endpoint" aria-label="Доступно в Eken">E</span>' : ''}
          </span>
        </div>
        ${hasEkenRoute(p) ? `
          <a
            class="eken-table-action"
            href="${getEkenPositionUrl(p)}"
            onclick="event.stopPropagation()"
            data-umami-event="place-to-position-route"
            data-umami-event-place="${p.id}"
          >${getEkenCtaLabel(p)} →<small class="route-direction">${FIRST_STEP_DIRECTION}</small></a>
        ` : ''}
      </td>
      <td class="col-desc">${p.description}</td>
      <td><span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]}</span><br><small style="color:#6b7280">${p.capacity.range_label}</small></td>
      <td><span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span></td>
      <td><span class="badge badge-conf-${p.confidence}">${CONF_RU[p.confidence]}</span></td>
      <td class="col-players"><small class="historical-field">${HISTORICAL_FIELDS_LABEL}</small>${p.key_players.join(', ')}</td>
      <td class="col-conditions"><small class="historical-field">${HISTORICAL_FIELDS_LABEL}</small>${p.entry_conditions.join('; ')}</td>
      <td class="col-evidence">${p.evidence}</td>
    </tr>
  `).join('');
}

function tableCol(col, label) {
  const arrow = sortCol === col ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th data-col="${col}">${label}<span class="sort-arrow">${arrow}</span></th>`;
}

function sortPlaces(places) {
  if (!sortCol) return places;
  return [...places].sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'srt_level': va = a.srt_level; vb = b.srt_level; break;
      case 'name': va = a.name; vb = b.name; break;
      case 'description': va = a.description; vb = b.description; break;
      case 'capacity':
        const cm = { unknown: 0, large: 3, medium: 2, small: 1 };
        va = cm[a.capacity.category]; vb = cm[b.capacity.category]; break;
      case 'window':
        const wm = { open: 1, narrowing: 2, closing: 3 };
        va = wm[a.window.category]; vb = wm[b.window.category]; break;
      case 'confidence':
        const cfm = { unknown: 0, high: 3, medium: 2, low: 1 };
        va = cfm[a.confidence]; vb = cfm[b.confidence]; break;
      default: va = a[sortCol]; vb = b[sortCol];
    }
    if (typeof va === 'string') {
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

// Each overlay retains the exact invoking control, including nested share dialogs.
const dialogStack = [];
function focusableIn(box) {
  return [...box.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter(el => el.getClientRects().length && !el.closest('[inert]'));
}
function activateDialog(overlay, trigger) {
  if (dialogStack.some(entry => entry.overlay === overlay)) return;
  const previous = [...document.body.children].map(el => [el, el.inert]);
  dialogStack.push({ overlay, trigger: trigger || document.activeElement, previous });
  for (const [el] of previous) if (el !== overlay && !['SCRIPT','STYLE'].includes(el.tagName)) el.inert = true;
  overlay.inert = false;
  overlay.setAttribute('aria-hidden', 'false');
  overlay.classList.add('open');
  const box = overlay.querySelector('[role="dialog"]');
  (focusableIn(box)[0] || box).focus();
}
function deactivateDialog(overlay) {
  const entry = dialogStack.at(-1);
  if (!entry || entry.overlay !== overlay) return;
  dialogStack.pop();
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  for (const [el, inert] of entry.previous) el.inert = inert;
  const target = entry.trigger?.isConnected && entry.trigger !== document.body ? entry.trigger : [...document.querySelectorAll('[data-tab]')].find(el => el.getClientRects().length && !el.disabled);
  if (target && target !== document.body) {
    if (!target.matches('button,a[href],input,[tabindex]')) target.tabIndex = -1;
    target.focus({preventScroll: true});
  }
}
function initModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => {
    const active = dialogStack.at(-1);
    if (!active) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (active.overlay.id === 'share-overlay') closePlaceShare(); else closeModal();
    } else if (e.key === 'Tab') {
      const box = active.overlay.querySelector('[role="dialog"]');
      const items = focusableIn(box), first = items[0] || box, last = items.at(-1) || box;
      if (!box.contains(document.activeElement) || (e.shiftKey && document.activeElement === first) || (!e.shiftKey && document.activeElement === last) || !items.length) {
        e.preventDefault(); (e.shiftKey ? last : first).focus();
      }
    }
  });
  document.addEventListener('focusin', e => {
    const active = dialogStack.at(-1);
    if (active && !active.overlay.contains(e.target)) {
      const box = active.overlay.querySelector('[role="dialog"]');
      (focusableIn(box)[0] || box).focus();
    }
  });
}

        title="Копировать ссылку"
        onclick="sharePlaceDirect('${p.id}', 'copy', event)"
      ><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
    </div>

    ${hasEkenRoute(p) ? `
    <a
      class="modal-action"
      href="${getEkenPositionUrl(p)}"
      data-umami-event="place-to-position-route"
      data-umami-event-place="${p.id}"
    >
      <span>${getEkenCtaLabel(p)}<small class="route-direction">${FIRST_STEP_DIRECTION}</small></span>
      <span aria-hidden="true">→</span>
    </a>
    ` : ''}

    <div class="modal-desc">${p.description}</div>
    ${p.review ? `<div class="modal-section"><div class="modal-section-title">Проверка по источникам</div><div class="modal-section-body">${p.review.reason || ''}<p>Статус проверки относится к основанию уточнения, а не ко всем полям карточки.</p>${(p.review.source_ids || []).map(id => { const source = (PLACES_DATA.meta.sources || []).find(item => item.id === id); return source ? `<p><a href="${source.url}" target="_blank" rel="noopener">${source.title}</a> · ${source.published}<br>${source.event || ''}<br>${source.limit || ''}</p>` : ''; }).join('')}${p.cooperation ? `<p><strong>Участники:</strong> ${p.cooperation.participants}</p><p><strong>Передаваемый результат:</strong> ${p.cooperation.product}</p><p><strong>Средства:</strong> ${p.cooperation.means}</p><p>${p.cooperation.next_action_and_acceptance}</p>` : ''}</div></div>` : `<div class="modal-section"><div class="modal-section-title">Актуальность данных</div><div class="modal-section-body">Срез: ${PLACES_DATA.meta.period?.label || 'не указан'} · обновлено ${p.last_updated || PLACES_DATA.meta.generated_at || 'не указано'}.</div></div>`}

    <div class="card-badges" style="margin-bottom:16px">
      <span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]} ${p.capacity.range_label}</span>
      <span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span>
      <span class="badge badge-conf-${p.confidence}">⚡ ${CONF_RU[p.confidence]}</span>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Экономическая ёмкость</div>
      <div class="modal-section-body">
        <p><strong>Категория:</strong> ${CAPACITY_RU[p.capacity.category]} (${p.capacity.range_label})</p>
        <p><strong>Объём по проверенным данным:</strong> ${formatUSD(p.capacity.evidence_usd)}</p>
        <p><strong>Активных игроков:</strong> ${p.capacity.active_players_count ?? "Не установлено"}</p>
        <p><strong>Обоснование:</strong> ${p.capacity.reasoning}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Окно возможностей</div>
      <div class="modal-section-body">
        <p><strong>Статус:</strong> ${WINDOW_RU[p.window.category]} — ${p.window.label}</p>
        <p>${p.window.description}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Условия входа</div>
      <div class="modal-section-body">
        <small class="historical-field">${HISTORICAL_FIELDS_LABEL}</small><ul>${p.entry_conditions.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Ключевые игроки</div>
      <div class="modal-section-body"><small class="historical-field">${HISTORICAL_FIELDS_LABEL}</small>${p.key_players.join(', ')}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Evidence</div>
      <div class="modal-section-body" style="font-style:italic">${p.evidence}</div>
    </div>

    ${p.audience_lens ? `
    <div class="modal-section">
      <div class="modal-section-title">Целевая аудитория</div>
      <div class="modal-section-body">
        ${p.audience_lens.map(a => {
          const labels = { investor: '🎯 Инвестор', operator: '⚙️ Оператор', founder: '🚀 Стартапер' };
          return `<span class="badge" style="background:rgba(255,255,255,0.06);color:#c8cdd5;margin-right:6px">${labels[a] || a}</span>`;
        }).join('')}
      </div>
    </div>
    ` : ''}
  `;

  activateDialog(document.getElementById('modal-overlay'), trigger);
  if (syncUrl) updatePlaceQuery(p.id);
}

function closeModal() {
  deactivateDialog(document.getElementById('modal-overlay'));
  updatePlaceQuery(null);
}

function initPlaceSharing() {
  const overlay = document.getElementById('share-overlay');
  overlay.addEventListener('click', event => {
    if (event.target === overlay) closePlaceShare();
  });
}

function openPlaceShare(id, event) {
  event?.preventDefault();
  event?.stopPropagation();
  const place = getPlaceById(id);
  if (!place) return;

  currentSharedPlaceId = id;
  const overlay = document.getElementById('share-overlay');
  const box = document.getElementById('share-box');
  box.innerHTML = `
    <button class="modal-close" type="button" onclick="closePlaceShare()" aria-label="Закрыть">&times;</button>
    <div class="share-kicker">Опубликовать карточку</div>
    <div class="share-title" id="share-title">${place.name}</div>
    <div class="share-summary">Публикация получит отдельное превью этой позиции. Переход откроет карту сразу на выбранном месте.</div>
    <div class="share-options">
      <button type="button" class="share-option" onclick="openPlaceShareLink('${place.id}', 'telegram', event)">
        <span class="share-option-icon">↗</span><span>Telegram</span>
      </button>
      <button type="button" class="share-option" onclick="openPlaceShareLink('${place.id}', 'facebook', event)">
        <span class="share-option-icon">f</span><span>Facebook</span>
      </button>
      <button type="button" class="share-option" onclick="sharePlaceTo('instagram')">
        <span class="share-option-icon">◎</span><span>Instagram / меню ОС</span>
      </button>
      <button type="button" class="share-option" onclick="copyPlaceShareLink()">
        <span class="share-option-icon">⧉</span><span>Копировать ссылку</span>
      </button>
    </div>
    <div class="share-status" id="share-status" aria-live="polite"></div>
  `;
  activateDialog(overlay, event?.currentTarget || document.activeElement);
  trackPlaceShare('place_share_open', place, 'menu');
}

function closePlaceShare() {
  const overlay = document.getElementById('share-overlay');
  deactivateDialog(overlay);
  currentSharedPlaceId = null;
}

async function writeShareLink(url) {
  try {
    await navigator.clipboard.writeText(url);
  } catch (_) {
    const input = document.createElement('textarea');
    input.value = url;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
  }
}

async function copyPlaceShareLink(target = 'copy') {
  const place = getPlaceById(currentSharedPlaceId);
  if (!place) return;
  await writeShareLink(getPlaceShareUrl(place));
  const status = document.getElementById('share-status');
  if (status) status.textContent = 'Ссылка на карточку скопирована';
  const modalStatus = document.getElementById('modal-share-status');
  if (modalStatus) {
    modalStatus.textContent = 'Скопировано';
    window.setTimeout(() => {
      if (modalStatus.isConnected) modalStatus.textContent = '';
    }, 1800);
  }
  trackPlaceShare('place_share_complete', place, target);
}

async function sharePlaceDirect(id, target, event) {
  event?.preventDefault();
  event?.stopPropagation();
  if (!getPlaceById(id)) return;
  currentSharedPlaceId = id;
  if (target === 'copy') await copyPlaceShareLink();
  else await sharePlaceTo(target);
}

function trackDirectPlaceShare(id, target, event) {
  event?.stopPropagation();
  const place = getPlaceById(id);
  if (place) trackPlaceShare('place_share_complete', place, target);
}

function openPlaceShareLink(id, target, event) {
  event?.preventDefault();
  event?.stopPropagation();
  const place = getPlaceById(id);
  if (!place) return;
  const outbound = target === 'telegram' ? getTelegramShareUrl(place) : getFacebookShareUrl(place);
  trackPlaceShare('place_share_complete', place, target);
  window.location.assign(outbound);
}

async function sharePlaceTo(target) {
  const place = getPlaceById(currentSharedPlaceId);
  if (!place) return;
  const url = getPlaceShareUrl(place);
  const text = getPlaceShareText(place);

  if (target === 'instagram') {
    if (navigator.share) {
      try {
        await navigator.share({ title: place.name, text, url });
        trackPlaceShare('place_share_complete', place, target);
        return;
      } catch (error) {
        if (error instanceof DOMException && error.name === 'AbortError') return;
      }
    }
    await copyPlaceShareLink(target);
    return;
  }

}

function openSharedPlaceFromUrl() {
  const id = new URL(window.location.href).searchParams.get('place');
  if (!id) return;
  const place = getPlaceById(id);
  if (!place) {
    updatePlaceQuery(null);
    return;
  }
  document.title = `${place.name} — Карта мест · Verkhovskiy AI`;
  openModal(id, false);
}
</script>
</body>
</html>
