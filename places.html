<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта мест СРТ — AIwatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0e17;
  color: #c8cdd5;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════ */
.page-wrapper {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ═══════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════ */
.header {
  padding: 28px 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-brand a {
  color: #00d4aa;
  text-decoration: none;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.header-brand a:hover { opacity: 1; }
.header-brand .sep { color: rgba(255,255,255,0.15); }
.header-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: #f0f2f5;
  letter-spacing: -0.02em;
}
.header-subtitle {
  font-size: 0.9rem;
  color: #6b7280;
  margin-top: 4px;
}
.header-meta {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.meta-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  font-size: 0.8rem;
  color: #9ca3af;
}
.meta-chip .val {
  color: #f0f2f5;
  font-weight: 600;
  font-family: 'Space Grotesk', sans-serif;
}

/* ═══════════════════════════════════════════════════════
   STATS BAR
   ═══════════════════════════════════════════════════════ */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  padding: 20px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.stat-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
}
.stat-card .num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #f0f2f5;
}
.stat-card .lbl {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #6b7280;
  margin-top: 2px;
}

/* ═══════════════════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════════════════ */
.filters-section {
  padding: 20px 0 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.filter-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #6b7280;
  margin-right: 4px;
}
.filter-btn {
  padding: 5px 12px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  background: transparent;
  color: #9ca3af;
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-btn:hover {
  border-color: rgba(0,212,170,0.3);
  color: #c8cdd5;
}
.filter-btn.active {
  background: rgba(0,212,170,0.12);
  border-color: rgba(0,212,170,0.4);
  color: #00d4aa;
}
.filter-reset {
  padding: 5px 12px;
  border: none;
  border-radius: 6px;
  background: rgba(255,255,255,0.05);
  color: #6b7280;
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-reset:hover { color: #f0f2f5; background: rgba(255,255,255,0.08); }

/* ═══════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════ */
.tabs-nav {
  display: flex;
  gap: 4px;
  padding: 8px 0 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.tab-btn {
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: #6b7280;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn:hover { color: #c8cdd5; }
.tab-btn.active {
  color: #00d4aa;
  border-bottom-color: #00d4aa;
}
.tab-panel { display: none; padding: 24px 0; }
.tab-panel.active { display: block; }

/* ═══════════════════════════════════════════════════════
   BUBBLE CHART
   ═══════════════════════════════════════════════════════ */
#bubble-chart {
  width: 100%;
  min-height: 560px;
  border-radius: 12px;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════
   MATRIX (CSS GRID)
   ═══════════════════════════════════════════════════════ */
.matrix-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 12px;
}
.matrix-grid {
  display: grid;
  grid-template-columns: repeat(9, minmax(200px, 1fr));
  gap: 10px;
  min-width: 1800px;
}
.matrix-col-header {
  text-align: center;
  padding: 10px 6px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px 8px 0 0;
  border-bottom: 2px solid;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #f0f2f5;
}
.matrix-col-header .level-num {
  display: block;
  font-size: 1.1rem;
  margin-bottom: 2px;
}
.matrix-column {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.place-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 14px;
  transition: all 0.2s;
  cursor: default;
}
.place-card:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.12);
  transform: translateY(-1px);
}
.place-card .card-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: #f0f2f5;
  margin-bottom: 6px;
  line-height: 1.35;
}
.place-card .card-desc {
  font-size: 0.73rem;
  color: #9ca3af;
  margin-bottom: 10px;
  line-height: 1.45;
}
.card-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.badge-cap-large  { background: rgba(0,212,170,0.12); color: #00d4aa; }
.badge-cap-medium { background: rgba(59,130,246,0.12); color: #60a5fa; }
.badge-cap-small  { background: rgba(156,163,175,0.12); color: #9ca3af; }
.badge-win-open    { background: rgba(52,211,153,0.12); color: #34d399; }
.badge-win-narrowing { background: rgba(251,191,36,0.12); color: #fbbf24; }
.badge-win-closing { background: rgba(239,68,68,0.12); color: #ef4444; }
.badge-conf-high   { background: rgba(0,212,170,0.08); color: #00d4aa; }
.badge-conf-medium { background: rgba(251,191,36,0.08); color: #fbbf24; }
.badge-conf-low    { background: rgba(239,68,68,0.08); color: #ef4444; }
.card-players {
  font-size: 0.7rem;
  color: #6b7280;
  margin-top: 6px;
}
.card-players span { color: #9ca3af; }
.card-conditions {
  margin-top: 6px;
  font-size: 0.68rem;
  color: #6b7280;
  line-height: 1.4;
}
.card-evidence {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 0.7rem;
  color: #6b7280;
  font-style: italic;
}

/* ═══════════════════════════════════════════════════════
   TABLE
   ═══════════════════════════════════════════════════════ */
.table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
  min-width: 1200px;
}
.data-table thead th {
  background: rgba(255,255,255,0.04);
  padding: 12px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #9ca3af;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 2;
}
.data-table thead th:hover { color: #f0f2f5; }
.data-table thead th .sort-arrow { margin-left: 4px; font-size: 0.6rem; }
.data-table tbody tr {
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.15s;
}
.data-table tbody tr:hover { background: rgba(255,255,255,0.03); }
.data-table tbody td {
  padding: 10px 14px;
  vertical-align: top;
  color: #c8cdd5;
}
.data-table .col-level {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  text-align: center;
  width: 40px;
}
.data-table .col-name { font-weight: 500; color: #f0f2f5; min-width: 200px; }
.data-table .col-desc { color: #9ca3af; min-width: 220px; max-width: 320px; }
.data-table .col-evidence { color: #9ca3af; font-style: italic; min-width: 180px; max-width: 280px; }
.data-table .col-players { min-width: 160px; }
.data-table .col-conditions { min-width: 180px; max-width: 260px; font-size: 0.72rem; }

/* ═══════════════════════════════════════════════════════
   LEVEL COLORS
   ═══════════════════════════════════════════════════════ */
.level-1  { --lc: #ef4444; }
.level-2  { --lc: #f97316; }
.level-3  { --lc: #eab308; }
.level-4  { --lc: #84cc16; }
.level-5  { --lc: #22c55e; }
.level-6  { --lc: #06b6d4; }
.level-7  { --lc: #3b82f6; }
.level-8  { --lc: #8b5cf6; }
.level-9  { --lc: #ec4899; }
.level-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--lc);
  margin-right: 6px;
  vertical-align: middle;
}

/* ═══════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════ */
.footer {
  padding: 24px 0;
  margin-top: 40px;
  border-top: 1px solid rgba(255,255,255,0.06);
  text-align: center;
  font-size: 0.72rem;
  color: #4b5563;
}

/* ═══════════════════════════════════════════════════════
   SIGNAL OF MONTH
   ═══════════════════════════════════════════════════════ */
.signal-banner {
  margin: 20px 0 8px;
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(0,212,170,0.06), rgba(59,130,246,0.04));
  border: 1px solid rgba(0,212,170,0.15);
  border-radius: 10px;
}
.signal-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #00d4aa;
  margin-bottom: 4px;
}
.signal-text {
  font-size: 0.88rem;
  color: #e5e7eb;
  line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════
   COUNTER BADGE
   ═══════════════════════════════════════════════════════ */
.count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: rgba(0,212,170,0.15);
  color: #00d4aa;
  font-size: 0.68rem;
  font-weight: 600;
  font-family: 'Space Grotesk', sans-serif;
  margin-left: 6px;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  html { font-size: 14px; }
  .page-wrapper { padding: 0 14px; }
  .header-title { font-size: 1.4rem; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .filters-section { gap: 8px; }
  .tabs-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn { padding: 8px 14px; font-size: 0.8rem; white-space: nowrap; }
  #bubble-chart { min-height: 400px; }
}
@media (max-width: 480px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .header-meta { gap: 8px; }
  .meta-chip { padding: 4px 10px; font-size: 0.72rem; }
}

/* ═══════════════════════════════════════════════════════
   DETAIL MODAL
   ═══════════════════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #12161f;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  max-width: 640px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 28px;
}
.modal-close {
  float: right;
  background: none;
  border: none;
  color: #6b7280;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
}
.modal-close:hover { color: #f0f2f5; }
.modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: #f0f2f5;
  margin-bottom: 4px;
  padding-right: 40px;
}
.modal-level {
  font-size: 0.75rem;
  color: #6b7280;
  margin-bottom: 16px;
}
.modal-desc {
  font-size: 0.88rem;
  color: #c8cdd5;
  line-height: 1.6;
  margin-bottom: 16px;
}
.modal-section {
  margin-bottom: 14px;
}
.modal-section-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #6b7280;
  margin-bottom: 6px;
}
.modal-section-body {
  font-size: 0.82rem;
  color: #c8cdd5;
  line-height: 1.5;
}
.modal-section-body ul {
  list-style: none;
  padding: 0;
}
.modal-section-body li {
  padding: 3px 0;
  padding-left: 16px;
  position: relative;
}
.modal-section-body li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: #00d4aa;
  font-size: 0.75rem;
}
</style>
</head>

function formatUSD(n) {
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(0) + 'M';
  return '$' + n.toLocaleString();
}

function getFiltered() {
  return PLACES_DATA.places.filter(p => {
    if (activeFilters.level && p.srt_level !== activeFilters.level) return false;
    if (activeFilters.capacity && p.capacity.category !== activeFilters.capacity) return false;
    if (activeFilters.window && p.window.category !== activeFilters.window) return false;
    return true;
  });
}

function renderFilters() {
  const sec = document.getElementById('filters-section');
  sec.innerHTML = `
    <div class="filter-group">
      <span class="filter-label">Уровень СРТ</span>
      ${[1,2,3,4,5,6,7,8,9].map(l => `
        <button class="filter-btn" data-filter="level" data-value="${l}"
                style="border-color: ${LEVEL_COLORS[l]}33">${l}</button>
      `).join('')}
    </div>
    <div class="filter-group">
      <span class="filter-label">Ёмкость</span>
      <button class="filter-btn" data-filter="capacity" data-value="large">Крупная</button>
      <button class="filter-btn" data-filter="capacity" data-value="medium">Средняя</button>
      <button class="filter-btn" data-filter="capacity" data-value="small">Малая</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">Окно</span>
      <button class="filter-btn" data-filter="window" data-value="open">Открыто</button>
      <button class="filter-btn" data-filter="window" data-value="narrowing">Сужается</button>
      <button class="filter-btn" data-filter="window" data-value="closing">Закрывается</button>
    </div>
    <button class="filter-reset" id="filter-reset">Сбросить</button>
  `;

  sec.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.filter;
      const val = btn.dataset.value;
      const parsed = key === 'level' ? parseInt(val) : val;

      if (activeFilters[key] === parsed) {
        activeFilters[key] = null;
        btn.classList.remove('active');
      } else {
        sec.querySelectorAll(`[data-filter="${key}"]`).forEach(b => b.classList.remove('active'));
        activeFilters[key] = parsed;
        btn.classList.add('active');
      }
      applyFilters();
    });
  });

  document.getElementById('filter-reset').addEventListener('click', () => {
    activeFilters = { level: null, capacity: null, window: null };
    sec.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    applyFilters();
  });
}

  renderBubble();
  renderMatrix();
  renderTable();
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'bubble') {
        setTimeout(() => Plotly.Plots.resize('bubble-chart'), 50);
      }
    });
  });
}

function renderBubble() {
  const places = getFiltered();
  const capMap = { large: 3, medium: 2, small: 1 };
  const confSize = { high: 28, medium: 18, low: 10 };

  // Group by window category for legend
  const groups = { open: [], narrowing: [], closing: [] };
  places.forEach(p => {
    const wc = p.window.category;
    if (groups[wc]) groups[wc].push(p);
  });

  const traces = Object.entries(groups).map(([wc, items]) => ({
    x: items.map(p => p.srt_level + (Math.random() - 0.5) * 0.3),
    y: items.map(p => capMap[p.capacity.category] + (Math.random() - 0.5) * 0.25),
    text: items.map(p =>
      `<b>${p.name}</b><br>` +
      `Уровень ${p.srt_level}: ${SRT_LEVELS[p.srt_level]}<br>` +
      `Ёмкость: ${CAPACITY_RU[p.capacity.category]} (${p.capacity.range_label})<br>` +
      `Окно: ${WINDOW_RU[p.window.category]}<br>` +
      `Уверенность: ${CONF_RU[p.confidence]}<br>` +
      `Игроки: ${p.key_players.slice(0, 3).join(', ')}`
    ),
    customdata: items.map(p => p.id),
    mode: 'markers',
    marker: {
      size: items.map(p => confSize[p.confidence]),
      color: items.map(p => LEVEL_COLORS[p.srt_level]),
      opacity: 0.75,
      line: { width: 1.5, color: WINDOW_COLORS[wc] },
    },
    name: WINDOW_RU[wc],
    hovertemplate: '%{text}<extra></extra>',
    type: 'scatter',
  }));

  const layout = {
    paper_bgcolor: '#0a0e17',
    plot_bgcolor: '#0f1320',
    font: { family: 'Inter, sans-serif', color: '#9ca3af', size: 12 },
    margin: { t: 40, r: 30, b: 60, l: 70 },
    xaxis: {
      title: { text: 'Уровень СРТ', font: { size: 13, color: '#6b7280' } },
      tickmode: 'array',
      tickvals: [1,2,3,4,5,6,7,8,9],
      ticktext: ['1','2','3','4','5','6','7','8','9'],
      gridcolor: 'rgba(255,255,255,0.04)',
      zeroline: false,
      range: [0.3, 9.7],
    },
    yaxis: {
      title: { text: 'Экономическая ёмкость', font: { size: 13, color: '#6b7280' } },
      tickmode: 'array',
      tickvals: [1, 2, 3],
      ticktext: ['< $100M', '$100M–$1B', '> $1B'],
      gridcolor: 'rgba(255,255,255,0.04)',
      zeroline: false,
      range: [0.4, 3.6],
    },
    legend: {
      x: 0, y: 1.12,
      orientation: 'h',
      font: { size: 11 },
      bgcolor: 'transparent',
    },
    hoverlabel: {
      bgcolor: '#1a1f2e',
      bordercolor: 'rgba(255,255,255,0.1)',
      font: { family: 'Inter', size: 12, color: '#e5e7eb' },
    },
    annotations: [1,2,3,4,5,6,7,8,9].map(l => ({
      x: l, y: 0.55, xref: 'x', yref: 'y',
      text: SRT_LEVELS[l].split(' ').slice(0, 2).join(' '),
      showarrow: false,
      font: { size: 9, color: LEVEL_COLORS[l] + '88' },
    })),
  };

  const config = {
    responsive: true,
    displayModeBar: false,
  };

    if (data.points.length > 0) {

// ═══════════════════════════════════════════════════════
function renderMatrix() {
  const places = getFiltered();
  const grid = document.getElementById('matrix-grid');
  grid.innerHTML = '';

  for (let level = 1; level <= 9; level++) {
    const levelPlaces = places.filter(p => p.srt_level === level);
    const col = document.createElement('div');
    col.className = 'matrix-column';

    // Header
    const header = document.createElement('div');
    header.className = `matrix-col-header level-${level}`;
    header.style.borderBottomColor = LEVEL_COLORS[level];
    header.innerHTML = `
      <span class="level-num">${level}</span>
      ${SRT_LEVELS[level]}
      <span class="count-badge">${levelPlaces.length}</span>
    `;
    col.appendChild(header);

    // Cards
    levelPlaces.forEach(p => {
      const card = document.createElement('div');
      card.className = 'place-card';
      card.style.borderLeftColor = LEVEL_COLORS[level];
      card.style.borderLeftWidth = '3px';
      card.onclick = () => openModal(p.id);
      card.style.cursor = 'pointer';

      card.innerHTML = `
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.description}</div>
        <div class="card-badges">
          <span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]} ${p.capacity.range_label}</span>
          <span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span>
          <span class="badge badge-conf-${p.confidence}">⚡ ${CONF_RU[p.confidence]}</span>
        </div>
        <div class="card-players">Игроки: <span>${p.key_players.slice(0, 3).join(', ')}${p.key_players.length > 3 ? '...' : ''}</span></div>
        <div class="card-conditions">${p.entry_conditions.map(c => '→ ' + c).join('<br>')}</div>
        <div class="card-evidence">${p.evidence}</div>
      `;
      col.appendChild(card);
    });

    grid.appendChild(col);
  }
}

// ═══════════════════════════════════════════════════════
// TABLE
// ═══════════════════════════════════════════════════════
function renderTable() {
  const places = getFiltered();
  const sorted = sortPlaces(places);

  // Head
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<tr>
    ${tableCol('srt_level', 'Ур.')}
    ${tableCol('name', 'Название')}
    ${tableCol('description', 'Описание')}
    ${tableCol('capacity', 'Ёмкость')}
    ${tableCol('window', 'Окно')}
    ${tableCol('confidence', 'Уверенность')}
    ${tableCol('key_players', 'Ключевые игроки')}
    ${tableCol('entry_conditions', 'Условия входа')}
    ${tableCol('evidence', 'Evidence')}
  </tr>`;

  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'asc';
      }
      renderTable();
    });
  });

  // Body
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = sorted.map(p => `
    <tr onclick="openModal('${p.id}')" style="cursor:pointer">
      <td class="col-level level-${p.srt_level}"><span class="level-dot"></span>${p.srt_level}</td>
      <td class="col-name">${p.name}</td>
      <td class="col-desc">${p.description}</td>
      <td><span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]}</span><br><small style="color:#6b7280">${p.capacity.range_label}</small></td>
      <td><span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span></td>
      <td><span class="badge badge-conf-${p.confidence}">${CONF_RU[p.confidence]}</span></td>
      <td class="col-players">${p.key_players.join(', ')}</td>
      <td class="col-conditions">${p.entry_conditions.join('; ')}</td>
      <td class="col-evidence">${p.evidence}</td>
    </tr>
  `).join('');
}

function tableCol(col, label) {
  const arrow = sortCol === col ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th data-col="${col}">${label}<span class="sort-arrow">${arrow}</span></th>`;
}

function sortPlaces(places) {
  if (!sortCol) return places;
  return [...places].sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'srt_level': va = a.srt_level; vb = b.srt_level; break;
      case 'name': va = a.name; vb = b.name; break;
      case 'description': va = a.description; vb = b.description; break;
      case 'capacity':
        const cm = { large: 3, medium: 2, small: 1 };
        va = cm[a.capacity.category]; vb = cm[b.capacity.category]; break;
      case 'window':
        const wm = { open: 1, narrowing: 2, closing: 3 };
        va = wm[a.window.category]; vb = wm[b.window.category]; break;
      case 'confidence':
        const cfm = { high: 3, medium: 2, low: 1 };
        va = cfm[a.confidence]; vb = cfm[b.confidence]; break;
      default: va = a[sortCol]; vb = b[sortCol];
    }
    if (typeof va === 'string') {
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

// ═══════════════════════════════════════════════════════
// DETAIL MODAL
// ═══════════════════════════════════════════════════════
function initModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

function openModal(id) {
  const p = PLACES_DATA.places.find(pl => pl.id === id);
  if (!p) return;

  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-level level-${p.srt_level}">
      <span class="level-dot"></span>
      Уровень ${p.srt_level}: ${SRT_LEVELS[p.srt_level]}
    </div>
    <div class="modal-title">${p.name}</div>
    <div class="modal-desc">${p.description}</div>

    <div class="card-badges" style="margin-bottom:16px">
      <span class="badge badge-cap-${p.capacity.category}">${CAPACITY_RU[p.capacity.category]} ${p.capacity.range_label}</span>
      <span class="badge badge-win-${p.window.category}">${WINDOW_RU[p.window.category]}</span>
      <span class="badge badge-conf-${p.confidence}">⚡ ${CONF_RU[p.confidence]}</span>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Экономическая ёмкость</div>
      <div class="modal-section-body">
        <p><strong>Категория:</strong> ${CAPACITY_RU[p.capacity.category]} (${p.capacity.range_label})</p>
        <p><strong>Подтверждённый объём:</strong> ${formatUSD(p.capacity.evidence_usd)}</p>
        <p><strong>Активных игроков:</strong> ${p.capacity.active_players_count}</p>
        <p><strong>Обоснование:</strong> ${p.capacity.reasoning}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Окно возможностей</div>
      <div class="modal-section-body">
        <p><strong>Статус:</strong> ${WINDOW_RU[p.window.category]} — ${p.window.label}</p>
        <p>${p.window.description}</p>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Условия входа</div>
      <div class="modal-section-body">
        <ul>${p.entry_conditions.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Ключевые игроки</div>
      <div class="modal-section-body">${p.key_players.join(', ')}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Evidence</div>
      <div class="modal-section-body" style="font-style:italic">${p.evidence}</div>
    </div>

    ${p.audience_lens ? `
    <div class="modal-section">
      <div class="modal-section-title">Целевая аудитория</div>
      <div class="modal-section-body">
        ${p.audience_lens.map(a => {
          const labels = { investor: '🎯 Инвестор', operator: '⚙️ Оператор', founder: '🚀 Стартапер' };
          return `<span class="badge" style="background:rgba(255,255,255,0.06);color:#c8cdd5;margin-right:6px">${labels[a] || a}</span>`;
        }).join('')}
      </div>
    </div>
    ` : ''}
  `;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
</script>
